<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiran-AI - Free AI Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; }
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        p.subtitle { color: #94a3b8; }
        
        .card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #334155; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card h2 { color: #f43f5e; font-size: 1.4rem; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        
        label { display: block; margin-bottom: 8px; color: #cbd5e1; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 16px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; width: 100%; }
        button:hover { background: #1d4ed8; }
        
        .result-box { margin-top: 16px; padding: 12px; border-radius: 8px; background: #0f172a; border: 1px dashed #475569; color: #38bdf8; font-size: 0.95rem; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kiran-AI Studio</h1>
        <p class="subtitle">AI Voice, Video, Transcript & Digital Downloads</p>
    </header>

    <!-- 1. AI Voice Generation -->
    <div class="card">
        <h2>🎙️ AI Voice Generator (Limit: 5/day)</h2>
        <label>Text to Speech:</label>
        <textarea id="voiceText" rows="3" placeholder="Yahan apna text likhein..."></textarea>
        <label>Language:</label>
        <select id="voiceLang">
            <option value="Hindi">Hindi</option>
            <option value="English">English</option>
        </select>
        <button onclick="generateVoice()">Generate Voice</button>
        <div id="voiceResult" class="result-box" style="display:none;"></div>
    </div>

    <!-- 2. AI Video Generation -->
    <div class="card">
        <h2>🎥 AI Video Generator (Limit: 3/day)</h2>
        <label>Video Prompt:</label>
        <textarea id="videoPrompt" rows="3" placeholder="Describe the video you want to generate..."></textarea>
        <button onclick="generateVideo()">Generate Video</button>
        <div id="videoResult" class="result-box" style="display:none;"></div>
    </div>

    <!-- 3. AI Transcription & Translation -->
    <div class="card">
        <h2>📝 AI Transcript & Translation (Limit: 5/day)</h2>
        <label>Text / Transcript Data:</label>
        <textarea id="transcriptText" rows="3" placeholder="Enter text to translate or transcribe..."></textarea>
        <label>Target Language:</label>
        <input type="text" id="targetLang" value="Hindi" placeholder="e.g. Hindi, English, Spanish">
        <button onclick="generateTranscript()">Translate & Transcribe</button>
        <div id="transcriptResult" class="result-box" style="display:none;"></div>
    </div>

    <!-- 4. Digital Store Download -->
    <div class="card">
        <h2>📁 Digital Store Downloads (Limit: 2/day)</h2>
        <label>Select Template / Asset:</label>
        <select id="itemName">
            <option value="AI Music Preset Pack">AI Music Preset Pack</option>
            <option value="FutureBass Hub Template">FutureBass Hub Template</option>
            <option value="Video Editing Asset">Video Editing Asset</option>
        </select>
        <button onclick="downloadItem()">Download Resource</button>
        <div id="downloadResult" class="result-box" style="display:none;"></div>
    </div>
</div>

<script>
    const BACKEND_URL = "https://kiran-ai-ntzk.onrender.com";

    // 1. Voice Call
    async function generateVoice() {
        const text = document.getElementById("voiceText").value;
        const lang = document.getElementById("voiceLang").value;
        const resBox = document.getElementById("voiceResult");
        
        if(!text) return alert("Kripya text enter karein!");
        resBox.style.display = "block";
        resBox.innerText = "Processing...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/generate-voice`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, lang })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Error occurred");
            resBox.innerText = `Success: ${data.message} | Audio URL: ${data.audio_url}`;
        } catch (err) {
            resBox.innerText = `❌ ${err.message}`;
        }
    }

    // 2. Video Call
    async function generateVideo() {
        const prompt = document.getElementById("videoPrompt").value;
        const resBox = document.getElementById("videoResult");
        
        if(!prompt) return alert("Kripya prompt enter karein!");
        resBox.style.display = "block";
        resBox.innerText = "Generating Video...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/generate-video`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt, lang: "Hindi" })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Error occurred");
            resBox.innerText = `Success: ${data.message} | Status: ${data.status_url}`;
        } catch (err) {
            resBox.innerText = `❌ ${err.message}`;
        }
    }

    // 3. Transcript / Translation Call
    async function generateTranscript() {
        const text = document.getElementById("transcriptText").value;
        const targetLang = document.getElementById("targetLang").value;
        const resBox = document.getElementById("transcriptResult");

        if(!text) return alert("Kripya text enter karein!");
        resBox.style.display = "block";
        resBox.innerText = "Translating...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/transcript`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ text, target_lang: targetLang })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Error occurred");
            resBox.innerText = `Message: ${data.message} | Translation: ${data.translated_text}`;
        } catch (err) {
            resBox.innerText = `❌ ${err.message}`;
        }
    }

    // 4. Download Call
    async function downloadItem() {
        const itemName = document.getElementById("itemName").value;
        const resBox = document.getElementById("downloadResult");
        resBox.style.display = "block";
        resBox.innerText = "Checking limit...";

        try {
            const res = await fetch(`${BACKEND_URL}/api/download-item`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ item_name: itemName })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || "Error occurred");
            resBox.innerText = `✅ ${data.message} | Remaining today: ${data.remaining_downloads}`;
        } catch (err) {
            resBox.innerText = `❌ ${err.message}`;
        }
    }
</script>

</body>
</html>
